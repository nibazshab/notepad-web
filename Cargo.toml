[package]
name = "app"
version = "1.0.0"
edition = "2024"

[dependencies]
vercel_runtime = { version = "2", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5" }
rust-embed = "8"
askama = "0.16"
rand = "0.10"
axum-extra = { version = "0.12", features = ["typed-header"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.7", features = ["cors"] }
encoding_rs = "0.8"
thiserror = "2"
const_format = "0.2"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "api"
path = "api/api.rs"

[lib]
path = "src/lib.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[profile.minimalist]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
